services:
  db:
    image: postgres:16-alpine
    container_name: postgres-bootcamp
    restart: always
    environment:
      POSTGRES_DB: bootcamp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: