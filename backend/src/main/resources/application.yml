spring:
  application:
    name: desafio-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/bootcamp_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
  config:
    import: optional:file:.env

jwt:
  secret: ${JWT_SECRET:change-this-secret}
  expiration: ${JWT_EXPIRATION:86400000}
