databaseChangeLog:
  - changeSet:
      id: "03-create-table-preferences"
      author: "muriloBesson"
      changes:
        - createTable:
            tableName: "preferences"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "user_id"
                  type: "UUID"
                  constraints:
                    nullable: false
              - column:
                  name: "type_id"
                  type: "UUID"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "preferences"
            baseColumnNames: "user_id"
            referencedTableName: "users"
            referencedColumnNames: "id"
            constraintName: "fk_preferences_user_id"
        - addForeignKeyConstraint:
            baseTableName: "preferences"
            baseColumnNames: "type_id"
            referencedTableName: "activity_types"
            referencedColumnNames: "id"
            constraintName: "fk_preferences_type_id"
