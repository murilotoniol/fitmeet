databaseChangeLog:
  - changeSet:
      id: "02-create-table-activity-types"
      author: "muriloBesson"
      changes:
        - createTable:
            tableName: "activity_types"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "name"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "image"
                  type: "VARCHAR(255)"
