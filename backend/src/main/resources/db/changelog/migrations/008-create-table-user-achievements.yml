databaseChangeLog:
  - changeSet:
      id: "08-create-table-user-achievements"
      author: "muriloBesson"
      changes:
        - createTable:
            tableName: "user_achievements"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "user_id"
                  type: "UUID"
                  constraints:
                    nullable: false
              - column:
                  name: "achievement_id"
                  type: "UUID"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "user_achievements"
            baseColumnNames: "user_id"
            referencedTableName: "users"
            referencedColumnNames: "id"
            constraintName: "fk_user_achievements_user_id"
        - addForeignKeyConstraint:
            baseTableName: "user_achievements"
            baseColumnNames: "achievement_id"
            referencedTableName: "achievements"
            referencedColumnNames: "id"
            constraintName: "fk_user_achievements_achievement_id"
