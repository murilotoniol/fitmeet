databaseChangeLog:
  - changeSet:
      id: "05-create-table-activity-addresses"
      author: "muriloBesson"
      changes:
        - createTable:
            tableName: "activity_addresses"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "activity_id"
                  type: "UUID"
                  constraints:
                    nullable: false
              - column:
                  name: "latitude"
                  type: "DOUBLE"
                  constraints:
                    nullable: false
              - column:
                  name: "longitude"
                  type: "DOUBLE"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "activity_addresses"
            baseColumnNames: "activity_id"
            referencedTableName: "activities"
            referencedColumnNames: "id"
            constraintName: "fk_activity_addresses_activity_id"
